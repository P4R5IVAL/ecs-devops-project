
name: Flask CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::138720667855:role/github-actions-ecr-role
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Python version
        run: python3 --version

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -t flask-devops:test .

      - name: Start Flask container
        run: docker run -d --name flask-test -p 8080:8080 flask-devops:test

      - name: Test Flask health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1


name: Flask CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4


      - name: Check GitHub OIDC identity
        run: |
          curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
          python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print("Subject:",c["sub"]); print("Audience:",c["aud"])'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::138720667855:role/github-actions-ecr-role
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Python version
        run: python3 --version

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -t flask-devops:test .

      - name: Start Flask container
        run: docker run -d --name flask-test -p 8080:8080 flask-devops:test

      - name: Test Flask health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          docker tag flask-devops:test 138720667855.dkr.ecr.eu-west-2.amazonaws.com/flask-devops:${{ github.sha }}
          docker push 138720667855.dkr.ecr.eu-west-2.amazonaws.com/flask-devops:${{ github.sha }}

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: flask-container
          image: 138720667855.dkr.ecr.eu-west-2.amazonaws.com/flask-devops:${{ github.sha }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: flask-terraform-service
          cluster: flask-terraform-cluster
          wait-for-service-stability: true
